basePath: /
definitions:
  models.ArticleResponse:
    properties:
      source:
        type: string
      summary:
        type: string
      title:
        type: string
      url:
        type: string
    type: object
  models.GlobalQARequest:
    properties:
      question:
        maxLength: 500
        minLength: 3
        type: string
    required:
    - question
    type: object
  models.GlobalQAResponse:
    properties:
      answer:
        type: string
      provider:
        type: string
      question:
        type: string
      sources:
        items:
          $ref: '#/definitions/models.SemanticSearchResult'
        type: array
    type: object
  models.NewsQARequest:
    properties:
      question:
        maxLength: 500
        minLength: 3
        type: string
      urls:
        items:
          type: string
        maxItems: 5
        minItems: 1
        type: array
    required:
    - question
    - urls
    type: object
  models.NewsQAResponse:
    properties:
      answer:
        type: string
      question:
        type: string
      source:
        type: string
      sources:
        items:
          type: string
        type: array
    type: object
  models.SemanticSearchResult:
    properties:
      article_id:
        type: integer
      similarity:
        type: number
      source:
        type: string
      summary:
        type: string
      title:
        type: string
      url:
        type: string
    type: object
  models.SummarizeRequest:
    properties:
      urls:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - urls
    type: object
host: localhost:8080
info:
  contact:
    name: API Support
    url: https://github.com/Lesmana24/Concurrent-AI-News-Aggregator
  description: High-performance Concurrent AI News Aggregator backend in Go with web
    scraping, parallel LLM summarization, and strict guardrail News Q&A.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://github.com/Lesmana24/Concurrent-AI-News-Aggregator
  title: Concurrent AI News Aggregator API
  version: "1.0"
paths:
  /api/v1/health:
    get:
      description: Returns the operational status of the service, database connectivity,
        and timestamp.
      produces:
      - application/json
      responses:
        "200":
          description: Service is healthy and operational
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Database connectivity failure
          schema:
            additionalProperties: true
            type: object
      summary: Health and system readiness check
      tags:
      - System
  /api/v1/news/qa:
    post:
      consumes:
      - application/json
      description: Answers user questions strictly based on the extracted content
        of the provided news articles with anti-hallucination guardrails.
      parameters:
      - description: Question and list of news URLs (max 5)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.NewsQARequest'
      produces:
      - application/json
      responses:
        "200":
          description: Answer generated by AI
          schema:
            $ref: '#/definitions/models.NewsQAResponse'
        "400":
          description: Invalid request body or validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: API Key missing or invalid
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Quota exceeded
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal processing error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Ask questions about provided news articles
      tags:
      - News
  /api/v1/news/search:
    get:
      description: Searches stored news articles based on dense embedding cosine similarity
        (pgvector HNSW index).
      parameters:
      - description: Search query string
        in: query
        name: q
        required: true
        type: string
      - description: Maximum number of results to return (default 5, max 20)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Matching articles ordered by relevance
          schema:
            items:
              $ref: '#/definitions/models.SemanticSearchResult'
            type: array
        "400":
          description: Invalid query parameter
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal search error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Semantic vector search across archived news articles
      tags:
      - News
  /api/v1/qa:
    post:
      consumes:
      - application/json
      description: Answers user questions strictly based on the extracted content
        of the provided news articles with anti-hallucination guardrails.
      parameters:
      - description: Question and list of news URLs (max 5)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.NewsQARequest'
      produces:
      - application/json
      responses:
        "200":
          description: Answer generated by AI
          schema:
            $ref: '#/definitions/models.NewsQAResponse'
        "400":
          description: Invalid request body or validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: API Key missing or invalid
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Quota exceeded
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal processing error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Ask questions about provided news articles
      tags:
      - News
  /api/v1/qa/global:
    post:
      consumes:
      - application/json
      description: Performs Retrieval-Augmented Generation (RAG) across all previously
        scraped news in PostgreSQL vector database.
      parameters:
      - description: User question
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.GlobalQARequest'
      produces:
      - application/json
      responses:
        "200":
          description: Answer generated from relevant archived articles
          schema:
            $ref: '#/definitions/models.GlobalQAResponse'
        "400":
          description: Invalid request body or validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: API Key missing or invalid
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Quota exceeded
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal processing error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Ask questions across all archived news articles (Global RAG)
      tags:
      - News
  /api/v1/qa/stream:
    post:
      consumes:
      - application/json
      description: Streams answer tokens incrementally in real-time (Server-Sent Events)
        based on extracted news content.
      parameters:
      - description: Question and list of news URLs (max 5)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.NewsQARequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: Server-Sent Events stream
          schema:
            type: string
        "400":
          description: Invalid request body or validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: API Key missing or invalid
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Quota exceeded
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal processing error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Ask questions about news articles with real-time SSE streaming
      tags:
      - News
  /api/v1/summarize:
    post:
      consumes:
      - application/json
      description: Scrapes provided news URLs in parallel using goroutines, extracts
        content & real titles, queries configured AI provider with fallback, and caches
        results.
      parameters:
      - description: List of news URLs to summarize
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.SummarizeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: List of summarized articles
          schema:
            items:
              $ref: '#/definitions/models.ArticleResponse'
            type: array
        "400":
          description: Invalid request or validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: API Key missing or invalid
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Quota exceeded
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal processing error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Summarize news articles concurrently
      tags:
      - News
securityDefinitions:
  ApiKeyAuth:
    description: Personal API key for authentication and quota management
    in: header
    name: X-API-KEY
    type: apiKey
swagger: "2.0"
