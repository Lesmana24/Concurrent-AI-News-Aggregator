basePath: /
definitions:
  crawler.CrawlResult:
    properties:
      duration:
        type: integer
      errors:
        items:
          type: string
        type: array
      fetched:
        type: integer
      indexed:
        type: integer
      skipped:
        type: integer
      start_time:
        type: string
    type: object
  crawler.CrawlStats:
    properties:
      active_feed_count:
        type: integer
      is_running:
        type: boolean
      last_duration_ms:
        type: integer
      last_run_time:
        type: string
      total_errors:
        type: integer
      total_fetched:
        type: integer
      total_indexed:
        type: integer
      total_runs:
        type: integer
      total_skipped:
        type: integer
    type: object
  models.ArticleResponse:
    properties:
      image_url:
        type: string
      source:
        type: string
      summary:
        type: string
      title:
        type: string
      url:
        type: string
    type: object
  models.ClusterDetailResponse:
    properties:
      article_count:
        type: integer
      articles:
        items:
          $ref: '#/definitions/models.ArticleResponse'
        type: array
      hotness_score:
        type: number
      id:
        type: integer
      image_url:
        type: string
      last_updated:
        type: string
      outlets:
        items:
          type: string
        type: array
      secondary_image_url:
        type: string
      summary:
        type: string
      title:
        type: string
      unique_outlets:
        type: integer
    type: object
  models.GlobalQARequest:
    properties:
      question:
        maxLength: 500
        minLength: 3
        type: string
    required:
    - question
    type: object
  models.GlobalQAResponse:
    properties:
      answer:
        type: string
      provider:
        type: string
      question:
        type: string
      sources:
        items:
          $ref: '#/definitions/models.SemanticSearchResult'
        type: array
    type: object
  models.MediaFraming:
    properties:
      dominant_framing:
        description: Sudut pandang atau penekanan utama
        type: string
      highlighted_facts:
        items:
          type: string
        type: array
      outlet_name:
        type: string
      sentiment:
        description: Positif / Netral / Kritis
        type: string
      sentiment_score:
        description: -1.0 to 1.0
        type: number
      source_url:
        type: string
    type: object
  models.NewsCompareRequest:
    properties:
      urls:
        items:
          type: string
        maxItems: 5
        minItems: 2
        type: array
    required:
    - urls
    type: object
  models.NewsCompareResponse:
    properties:
      consensus_facts:
        items:
          type: string
        type: array
      divergences:
        items:
          type: string
        type: array
      media_comparisons:
        items:
          $ref: '#/definitions/models.MediaFraming'
        type: array
      objective_summary:
        type: string
      provider:
        type: string
      topic:
        type: string
    type: object
  models.NewsQARequest:
    properties:
      question:
        maxLength: 500
        minLength: 3
        type: string
      urls:
        items:
          type: string
        maxItems: 5
        type: array
    required:
    - question
    type: object
  models.NewsQAResponse:
    properties:
      answer:
        type: string
      question:
        type: string
      source:
        type: string
      sources:
        items:
          type: string
        type: array
    type: object
  models.SemanticSearchResult:
    properties:
      article_id:
        type: integer
      similarity:
        type: number
      source:
        type: string
      summary:
        type: string
      title:
        type: string
      url:
        type: string
    type: object
  models.SummarizeRequest:
    properties:
      url:
        type: string
      urls:
        items:
          type: string
        type: array
    type: object
  models.TrendingClusterItem:
    properties:
      article_count:
        type: integer
      hotness_score:
        type: number
      id:
        type: integer
      image_url:
        type: string
      last_updated:
        type: string
      outlets:
        items:
          type: string
        type: array
      secondary_image_url:
        type: string
      summary:
        type: string
      title:
        type: string
      unique_outlets:
        type: integer
    type: object
  models.TrendingClusterResponse:
    properties:
      computed_at:
        type: string
      topics:
        items:
          $ref: '#/definitions/models.TrendingClusterItem'
        type: array
      total_clusters:
        type: integer
    type: object
  scheduler.BroadcastRequest:
    properties:
      message:
        description: 'Optional: custom announcement message; if empty, synthesizes
          AI briefing'
        type: string
      topic:
        description: 'Optional: specific topic (e.g. "teknologi") or empty for all'
        type: string
    type: object
  scheduler.BroadcastResult:
    properties:
      duration:
        type: integer
      errors:
        items:
          type: string
        type: array
      failed_count:
        type: integer
      success_count:
        type: integer
      topic:
        type: string
      total_subscribers:
        type: integer
      triggered_at:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: High-performance production API in Go that concurrently summarizes
    news articles with real-time web scraping, multi-provider AI resilience (Groq/NVIDIA/Gemini),
    Server-Sent Events (SSE) streaming Q&A, pgvector semantic search, and media bias
    comparative analysis.
  title: Concurrent AI News Aggregator API
  version: "1.0"
paths:
  /api/v1/crawler/status:
    get:
      description: Returns cumulative harvesting statistics including total runs,
        indexed articles, skipped count, and running state.
      produces:
      - application/json
      responses:
        "200":
          description: Current crawler status and statistics
          schema:
            $ref: '#/definitions/crawler.CrawlStats'
        "503":
          description: Crawler engine is not configured
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get news crawler status and execution statistics
      tags:
      - Crawler
  /api/v1/crawler/trigger:
    post:
      description: Triggers an on-demand crawl across all enabled RSS/Atom feeds,
        deduplicating, summarizing, and indexing new articles.
      produces:
      - application/json
      responses:
        "200":
          description: Crawl execution result
          schema:
            $ref: '#/definitions/crawler.CrawlResult'
        "401":
          description: API Key missing or invalid
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Crawler is already running
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Crawler engine error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Crawler engine is not configured
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Manually trigger news crawler ingestion
      tags:
      - Crawler
  /api/v1/health:
    get:
      description: Returns the operational status of the service, database connectivity,
        and timestamp.
      produces:
      - application/json
      responses:
        "200":
          description: Service is healthy and operational
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Database connectivity failure
          schema:
            additionalProperties: true
            type: object
      summary: Health and system readiness check
      tags:
      - System
  /api/v1/news/clusters/{id}:
    get:
      description: Returns detailed consensus and all articles from various outlets
        in this topic cluster.
      parameters:
      - description: Cluster ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Cluster detail and articles
          schema:
            $ref: '#/definitions/models.ClusterDetailResponse'
        "400":
          description: Invalid cluster ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Cluster not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Database error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get cluster details and all included articles
      tags:
      - Trending
  /api/v1/news/clusters/recompute:
    post:
      description: Manually recalculates topic clusters and trending scores across
        recent articles.
      produces:
      - application/json
      responses:
        "200":
          description: Clustering execution summary
          schema:
            additionalProperties: true
            type: object
        "401":
          description: API Key missing or invalid
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Clustering is already in progress
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Clustering error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Clustering engine is not configured
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Trigger on-demand clustering calculation
      tags:
      - Trending
  /api/v1/news/compare:
    post:
      consumes:
      - application/json
      description: Analyzes 2 to 5 news articles on the same topic from different
        outlets, reporting sentiment, framing bias, consensus facts, and discrepancies.
      parameters:
      - description: List of 2 to 5 news URLs to compare
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.NewsCompareRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Comparative journalism report with bias and sentiment scores
          schema:
            $ref: '#/definitions/models.NewsCompareResponse'
        "400":
          description: Invalid request body or insufficient URLs
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: API Key missing or invalid
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Quota exceeded
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal processing error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Compare multiple news articles for media bias and framing analysis
      tags:
      - News
  /api/v1/news/qa:
    post:
      consumes:
      - application/json
      description: Answers user questions strictly based on the extracted content
        of the provided news articles with anti-hallucination guardrails.
      parameters:
      - description: Question and list of news URLs (max 5)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.NewsQARequest'
      produces:
      - application/json
      responses:
        "200":
          description: Answer generated by AI
          schema:
            $ref: '#/definitions/models.NewsQAResponse'
        "400":
          description: Invalid request body or validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: API Key missing or invalid
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Quota exceeded
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal processing error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Ask questions about provided news articles
      tags:
      - News
  /api/v1/news/recent:
    get:
      description: Retrieves recent articles from the news wire with optional filtering
        by media source.
      parameters:
      - description: 'Number of articles to return (default: 20, max: 100)'
        in: query
        name: limit
        type: integer
      - description: Filter by news outlet source (e.g. Antara News, CNBC Indonesia)
        in: query
        name: source
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of recent articles
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get recent harvested articles
      tags:
      - News
  /api/v1/news/search:
    get:
      description: Searches stored news articles based on dense embedding cosine similarity
        (pgvector HNSW index).
      parameters:
      - description: Search query string
        in: query
        name: q
        required: true
        type: string
      - description: Maximum number of results to return (default 5, max 20)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Matching articles ordered by relevance
          schema:
            items:
              $ref: '#/definitions/models.SemanticSearchResult'
            type: array
        "400":
          description: Invalid query parameter
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal search error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Semantic vector search across archived news articles
      tags:
      - News
  /api/v1/news/trending:
    get:
      description: Returns top ranked trending news topics clustered across multiple
        independent outlets.
      parameters:
      - description: Max topics to return (default 5, max 20)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of trending topics
          schema:
            $ref: '#/definitions/models.TrendingClusterResponse'
        "500":
          description: Clustering error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Clustering engine is not configured
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get trending news topics and story clusters
      tags:
      - Trending
  /api/v1/notifications/broadcast:
    post:
      consumes:
      - application/json
      description: Synthesizes an executive daily news digest and broadcasts it via
        Telegram to active subscribers.
      parameters:
      - description: Optional broadcast parameters (topic, custom message)
        in: body
        name: request
        schema:
          $ref: '#/definitions/scheduler.BroadcastRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Broadcast dispatch results
          schema:
            items:
              $ref: '#/definitions/scheduler.BroadcastResult'
            type: array
        "401":
          description: API Key missing or invalid
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Broadcast cycle is already in progress
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Broadcast execution error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Scheduler engine is not configured
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Manually trigger news briefing push broadcast
      tags:
      - Notifications
  /api/v1/notifications/subscriptions:
    get:
      description: Returns active subscriber metrics, breakdown by topic, and cumulative
        scheduler performance.
      produces:
      - application/json
      responses:
        "200":
          description: Subscription metrics and scheduler statistics
          schema:
            additionalProperties: true
            type: object
        "401":
          description: API Key missing or invalid
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Database error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get notification subscribers and scheduler statistics
      tags:
      - Notifications
  /api/v1/qa:
    post:
      consumes:
      - application/json
      description: Answers user questions strictly based on the extracted content
        of the provided news articles with anti-hallucination guardrails.
      parameters:
      - description: Question and list of news URLs (max 5)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.NewsQARequest'
      produces:
      - application/json
      responses:
        "200":
          description: Answer generated by AI
          schema:
            $ref: '#/definitions/models.NewsQAResponse'
        "400":
          description: Invalid request body or validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: API Key missing or invalid
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Quota exceeded
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal processing error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Ask questions about provided news articles
      tags:
      - News
  /api/v1/qa/global:
    post:
      consumes:
      - application/json
      description: Performs Retrieval-Augmented Generation (RAG) across all previously
        scraped news in PostgreSQL vector database.
      parameters:
      - description: User question
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.GlobalQARequest'
      produces:
      - application/json
      responses:
        "200":
          description: Answer generated from relevant archived articles
          schema:
            $ref: '#/definitions/models.GlobalQAResponse'
        "400":
          description: Invalid request body or validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: API Key missing or invalid
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Quota exceeded
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal processing error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Ask questions across all archived news articles (Global RAG)
      tags:
      - News
  /api/v1/qa/stream:
    post:
      consumes:
      - application/json
      description: Streams answer tokens incrementally in real-time (Server-Sent Events)
        based on extracted news content.
      parameters:
      - description: Question and list of news URLs (max 5)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.NewsQARequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: Server-Sent Events stream
          schema:
            type: string
        "400":
          description: Invalid request body or validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: API Key missing or invalid
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Quota exceeded
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal processing error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Ask questions about news articles with real-time SSE streaming
      tags:
      - News
  /api/v1/summarize:
    post:
      consumes:
      - application/json
      description: Scrapes provided news URLs in parallel using goroutines, extracts
        content & real titles, queries configured AI provider with fallback, and caches
        results.
      parameters:
      - description: List of news URLs to summarize
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.SummarizeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: List of summarized articles
          schema:
            items:
              $ref: '#/definitions/models.ArticleResponse'
            type: array
        "400":
          description: Invalid request or validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: API Key missing or invalid
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Quota exceeded
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal processing error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Summarize news articles concurrently
      tags:
      - News
  /api/v1/user/me:
    get:
      description: Returns user profile, current remaining quota, and API key status
        for the dashboard.
      produces:
      - application/json
      responses:
        "200":
          description: User profile and quota telemetry
          schema:
            additionalProperties: true
            type: object
        "401":
          description: API Key is missing or invalid
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get current API Key and quota telemetry
      tags:
      - User
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: X-API-KEY
    type: apiKey
swagger: "2.0"
